  <title>Mokausi lietuviškai</title>
  <meta name="description" content="Lithuanian learning games for young children.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Nunito:wght@500;700;800&display=swap">

<body>
<div class="clouds" aria-hidden="true"><span>☁️</span><span>☁️</span><span>☁️</span></div>
<div class="wrap">
  <header>
    <button class="brand" id="homeBtn" aria-label="Pradžia (home)" data-say="Mokausi lietuviškai|I'm learning Lithuanian">
      <span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1>Mokausi lietuviškai</h1>
    </button>
    <div class="hdr-right">
      <button class="who" id="who" hidden aria-label="Pakeisti žaidėją (switch player)" data-say="Kas žaidžia?|Who's playing?"><span class="emo" id="whoAv"></span><span id="whoName"></span></button>
      <div class="stars" id="stars" aria-label="Žvaigždutės (stars)" data-say="Žvaigždutės|Stars"><span class="emo">⭐</span><span id="starN">0</span></div>
    </div>
  </header>
  <div class="note" id="voiceNote" hidden>
    <p><b>The sounds didn’t load.</b> Check your internet connection and reload the page.</p>
    <button id="closeNote" aria-label="Close">×</button>
  </div>
  <main id="screen" class="wrap" style="padding:0;gap:18px"></main>
</div>
